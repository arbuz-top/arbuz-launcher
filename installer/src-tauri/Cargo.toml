[package]
name = "quarry-installer"
version = "1.0.0"
edition = "2021"
description = "Установщик Quarry"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
mslnk = "0.1.8"
winreg = "0.55"
thiserror = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
